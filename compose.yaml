services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/some-company.sqlite
      PORT: 3000
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - some-company-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  some-company-data:
